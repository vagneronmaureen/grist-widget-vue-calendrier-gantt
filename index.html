<!doctype html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendrier / Gantt DSFR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/utility/icons/icons.min.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; overflow: hidden;
         background: var(--background-alt-grey, #f6f6f6); color: var(--text-default-grey, #3a3a3a); }
  .kb-bar { display: flex; align-items: center; gap: .75rem; padding: .5rem 1rem; background: #fff;
            border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .kb-bar .kb-title { font-weight: 700; font-size: 1rem; color: var(--text-title-grey, #161616); margin: 0; }
  .kb-bar .kb-spacer { flex: 1; }
  .kb-bar input[type=search] { max-width: 260px; }
  .kb-board { flex: 1; overflow: auto; display: flex; gap: 1rem; padding: 1rem; align-items: flex-start; }
  .kb-empty { margin: auto; text-align: center; padding: 2rem; }

  .kb-col { flex: 0 0 290px; max-height: 100%; display: flex; flex-direction: column; border-radius: 4px;
            background: var(--col-bg); border-top: 4px solid var(--col-bar); position: relative; }
  .kb-col-head { display: flex; align-items: center; gap: .5rem; padding: .625rem .75rem; }
  .kb-col-body { padding-bottom: .75rem !important; }
  .kb-modal-head input.fr-input { font-size: 1.125rem; font-weight: 700; flex: 1; }
  .kb-col-name { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                 color: var(--text-title-grey, #161616); }
  .kb-count { background: #fff; border-radius: 1rem; padding: 0 .5rem; font-size: .75rem; font-weight: 700; line-height: 1.5rem; }
  .kb-col-body { padding: 0 .5rem .5rem; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; min-height: 3rem; flex: 1; }
  .kb-col-body.drag-over { outline: 2px dashed var(--col-bar); outline-offset: -4px; border-radius: 4px; }

  .kb-card { background: #fff; border-radius: 4px; padding: .75rem; cursor: grab;
             box-shadow: 0 0 0 1px var(--border-default-grey, #ddd); }
  .kb-card:hover { box-shadow: 0 0 0 1px var(--text-action-high-blue-france, #000091), 0 2px 6px rgba(0,0,0,.12); }
  .kb-card.dragging { opacity: .4; }
  .kb-card-title { margin: 0 0 .25rem; font-size: 1rem; line-height: 1.4; font-weight: 700; color: var(--text-title-grey, #161616); }
  .kb-fields { display: flex; flex-direction: column; gap: .5rem; margin-top: .5rem; font-size: .875rem; }
  .kb-f { display: block; }
  .kb-f-label { color: var(--text-mention-grey, #666); font-size: .75rem; line-height: 1.25rem; }
  .kb-f-val { line-height: 1.5rem; }
  .kb-link { word-break: break-all; }
  .kb-check { width: 1rem; height: 1rem; accent-color: var(--text-action-high-blue-france, #000091); vertical-align: middle; }
  .kb-cell { margin-bottom: 1rem; min-width: 0; position: relative; }
  .kb-cell-label { display: flex; align-items: center; gap: .3rem; font-size: .6875rem; font-weight: 700; color: var(--text-mention-grey, #666); text-transform: uppercase; letter-spacing: .07em; margin-bottom: .25rem; }
  .kb-emoji { font-style: normal; text-transform: none; letter-spacing: 0; }
  .kb-val { font-size: .875rem; line-height: 1.5rem; white-space: pre-wrap; }
  .kb-empty-val { display: inline-block; padding: 1px 8px; background: #fff0f0; border: 1px solid #ffd9d9; border-radius: 4px; color: #e1000f; font-size: .75rem; font-style: italic; }
  .kb-ro .kb-ic { display: none; }
  .kb-cell { container-type: inline-size; container-name: cell; }
  /* champ étroit (⅓) : l'étiquette « Formule » / « Lecture seule » devient une petite icône pour ne pas coller au champ voisin */
  @container cell (max-width: 280px) { .kb-ro .kb-tx { display: none; } .kb-ro .kb-ic { display: inline; } .kb-ro { padding: 0 4px; } }
  .kb-ro { margin-left: auto; flex-shrink: 0; font-size: .625rem; font-weight: 600; letter-spacing: .05em; color: #929292; background: #f0f0f0; border: 1px solid #ddd; border-radius: 3px; padding: 0 5px; text-transform: uppercase; }
  .kb-info { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; background: #929292; color: #fff; font-size: 9px; font-style: normal; font-weight: 700; letter-spacing: 0; text-transform: none; cursor: default; position: relative; }
  .kb-info:hover, .kb-info:focus { background: #000091; outline: none; }
  .kb-info::after { content: attr(data-tip); display: none; position: absolute; left: 0; top: calc(100% + 6px); width: max-content; max-width: 260px; background: #2b2b2b; color: #fff; padding: 7px 10px; border-radius: 6px; font-size: .75rem; font-weight: 400; line-height: 1.5; text-transform: none; white-space: pre-wrap; z-index: 70; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .kb-info:hover::after, .kb-info:focus::after { display: block; }
  .kb-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .kb-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 10px; font-size: .75rem; line-height: 1.25rem; }
  .kb-x { border: 0; background: none; cursor: pointer; color: inherit; opacity: .7; font-size: .875rem; line-height: 1; padding: 0; }
  .kb-x:hover { opacity: 1; }
  .kb-dd { position: relative; }
  .kb-dd-trigger { display: flex; align-items: center; justify-content: space-between; gap: .5rem; width: 100%; min-height: 2.5rem; padding: .25rem .75rem; background: #eee; border: 0; border-bottom: 2px solid #3a3a3a; border-radius: .25rem .25rem 0 0; cursor: pointer; text-align: left; }
  .kb-chev2 { color: #666; font-size: .75rem; }
  .kb-plus { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #000091; background: #f0f0fb; color: #000091; font-size: .875rem; line-height: 1; cursor: pointer; padding: 0; }
  .kb-plus:hover { background: #000091; color: #fff; }
  .kb-dd-list { display: none; position: absolute; top: calc(100% + 4px); left: 0; min-width: 12rem; max-width: 100%; max-height: 14rem; overflow-y: auto; z-index: 60; background: #fff; border: 1px solid #ddd; border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.14); padding: 4px; }
  .kb-dd.kb-open > .kb-dd-list, .kb-ref .kb-dd:focus-within > .kb-dd-list { display: block; }
  .kb-dd-item { display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; padding: 5px 8px; border-radius: 2px; font-size: .8125rem; }
  .kb-dd-item:hover { background: #f6f6f6; }
  .kb-dd-none { padding: 8px 10px; color: #929292; font-size: .75rem; }
  .kb-ref .kb-tags { margin-bottom: .25rem; }
  .kb-numwrap { display: flex; align-items: center; gap: .5rem; }
  .kb-unit { color: #666; font-size: .875rem; }
  .kb-att { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; background: #e8f0fe; color: #1a73e8; font-size: .75rem; font-weight: 600; }
  .kb-att-name { border: 0; background: none; color: inherit; cursor: pointer; text-decoration: underline; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0; }
  .kb-att-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: .5rem; }
  .kb-auto { resize: none; overflow: hidden; }
  .kb-opts { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: flex-end; background: #f6f6f6; border-radius: 4px; padding: .5rem .75rem; margin: 0 0 .5rem; font-size: .75rem; }
  .kb-opts label { display: flex; flex-direction: column; gap: 2px; }
  .kb-emoji-in { width: 4rem; }
  .kb-emojis { display: flex; flex-wrap: wrap; gap: 2px; flex-basis: 100%; }
  .kb-emoji-btn { border: 1px solid transparent; background: none; cursor: pointer; font-size: 1rem; padding: 2px 4px; border-radius: 4px; }
  .kb-emoji-btn:hover { background: #e3e3fd; }
  .kb-opt-check { flex-direction: row !important; align-items: center; gap: .4rem !important; flex-basis: 100%; }
  .kb-opt-tags { display: flex; align-items: center; gap: .4rem; flex-basis: 100%; }
  .kb-swatch { border: 2px solid transparent; border-radius: 6px; width: 28px; height: 26px; font-size: .6875rem; font-weight: 700; cursor: pointer; }
  .kb-swatch.on { border-color: #161616; }
  .kb-badges { display: flex; flex-wrap: wrap; gap: .25rem; }
  .kb-badge { display: inline-block; border-radius: .25rem; padding: 0 .5rem; font-size: .75rem; font-weight: 700;
              line-height: 1.5rem; text-transform: uppercase; letter-spacing: .02em; }

  .kb-overlay { position: fixed; inset: 0; background: rgba(22,22,22,.64); z-index: 50; display: none;
                align-items: center; justify-content: center; padding: 1rem; }
  .kb-overlay.open { display: flex; }
  .kb-modal { background: #fff; width: min(720px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 4px; }
  .kb-modal-head { display: flex; align-items: flex-start; gap: 1rem; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .kb-modal-head h2 { margin: 0; flex: 1; font-size: 1.25rem; }
  .kb-modal-head { align-items: center; }
  .kb-modal-body { padding: 1rem 1.5rem; overflow-y: auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 0 1.5rem; align-content: start; flex: 1; }
  .kb-modal-body .fr-input-group { margin-bottom: 1rem; }
  .kb-modal-body > *, .kb-sec-body > * { grid-column: span 3; min-width: 0; }
  .kb-modal-body .kb-full, .kb-sec-body .kb-full { grid-column: 1 / -1; }
  .kb-modal-body .kb-w-third, .kb-sec-body .kb-w-third { grid-column: span 2; }
  .kb-modal-body .kb-w-two, .kb-sec-body .kb-w-two { grid-column: span 4; }
  .kb-wsel { font-size: .75rem; border: 1px solid #ddd; border-radius: 4px; background: #fff; padding: 1px 4px; }
  .kb-modal-foot { padding: 1rem 1.5rem; border-top: 1px solid var(--border-default-grey, #ddd); display: flex; justify-content: flex-end; gap: .75rem; }
  .kb-checks { display: flex; flex-wrap: wrap; gap: .25rem 1rem; max-height: 9rem; overflow-y: auto; }
  .kb-checks label { display: flex; gap: .375rem; align-items: center; font-size: .875rem; }

  .kb-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%); background: #fff; z-index: 40;
               box-shadow: -4px 0 16px rgba(0,0,0,.2); transform: translateX(105%); transition: transform .2s; overflow-y: auto; }
  .kb-drawer.open { transform: none; }
  .kb-drawer section { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .kb-drawer h3 { font-size: .9375rem; margin: 0 0 .75rem; }
  .kb-row { display: flex; gap: .375rem; align-items: center; margin-bottom: .375rem; }
  .kb-row .kb-row-name { flex: 1; font-size: .875rem; overflow: hidden; text-overflow: ellipsis; }
  .kb-row select { width: auto; }
  .kb-row { border-radius: 4px; padding: .125rem .25rem; background: #fff; }
  .kb-grip { cursor: grab; font-size: 1.25rem; line-height: 1; color: var(--text-mention-grey, #666); padding: 0 .25rem; user-select: none; }
  .kb-row:hover .kb-grip { color: var(--text-action-high-blue-france, #000091); }
  .row-dragging { opacity: .4; }
  .drop-before { box-shadow: 0 -3px 0 var(--text-action-high-blue-france, #000091); }
  .drop-after { box-shadow: 0 3px 0 var(--text-action-high-blue-france, #000091); }
  .drop-left { box-shadow: -3px 0 0 var(--text-action-high-blue-france, #000091); }
  .drop-right { box-shadow: 3px 0 0 var(--text-action-high-blue-france, #000091); }

  /* popup : mise en page */
  .kb-heading { margin: .5rem 0 .75rem; font-size: 1.125rem; line-height: 1.5; color: var(--text-title-grey, #161616); }
  .kb-divider { border: 0; border-top: 1px solid var(--border-default-grey, #ddd); margin: .5rem 0 1rem; padding: 0; }
  .kb-section { margin-bottom: 1rem; }
  .kb-sec-title { margin: 0 0 .5rem; font-size: 1rem; line-height: 1.5rem; }
  .kb-sec-toggle { display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer; padding: 0 0 .5rem;
                   font: inherit; font-weight: 700; font-size: 1.0625rem; color: var(--text-title-grey, #161616); }
  .kb-chev { display: inline-block; width: 1.25rem; color: var(--text-action-high-blue-france, #000091); }
  .kb-sec-body { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0 1.5rem; padding: 1rem 1rem 0; border-radius: 4px; background: rgba(0, 0, 145, .05); }
  .kb-section.kb-collapsed .kb-sec-body { display: none; }
  .kb-sec-input, .kb-heading-input { font-weight: 700; margin-bottom: .5rem; }
  .kb-blk { border: 1px dashed transparent; border-radius: 4px; padding: .25rem .375rem 0; margin-bottom: .25rem; }
  .kb-blk:hover { border-color: var(--border-default-grey, #bbb); }
  /* en mode mise en page, le contenu des champs ne capte pas la souris : le bloc entier reste une cible de dépôt (les champs désactivés n'émettent pas d'événements de glisser) */
  .kb-blk:not(.kb-section) > :not(.kb-blk-bar):not(.kb-heading-input):not(.kb-opts) { pointer-events: none; }
  .kb-blk-bar { display: flex; align-items: center; gap: .5rem; font-size: .75rem; color: var(--text-mention-grey, #666); margin-bottom: .25rem; }
  .kb-blk-kind { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kb-mini { background: #fff; border: 1px solid var(--border-default-grey, #ccc); border-radius: 3px; font-size: .75rem; padding: 0 .5rem; cursor: pointer; line-height: 1.375rem; }
  .kb-mini[aria-pressed="true"], .kb-mini[aria-expanded="true"] { background: #e3e3fd; border-color: var(--text-action-high-blue-france, #000091); }
  .kb-mini .kb-ic { display: none; }
  .kb-blk { container-type: inline-size; container-name: blk; }
  .kb-blk-bar { flex-wrap: wrap; row-gap: .25rem; }
  /* bloc étroit : les boutons de mise en forme passent en icônes seules (le libellé reste en info-bulle) */
  @container blk (max-width: 440px) {
    .kb-blk-bar .kb-tx { display: none; }
    .kb-blk-bar .kb-ic { display: inline; }
    .kb-blk-bar .kb-mini { padding: 0 .4rem; }
    .kb-blk-kind { display: none; }
    .kb-blk-bar { gap: .25rem; }
    .kb-blk-bar .kb-grip { margin-right: auto; }
  }
  .kb-mini:hover { border-color: var(--text-action-high-blue-france, #000091); }
  .kb-dropzone { border: 1px dashed var(--border-default-grey, #bbb); border-radius: 4px; color: var(--text-mention-grey, #888);
                 font-size: .8125rem; text-align: center; padding: .375rem; margin: .25rem 0 .75rem; }
  .kb-dropzone.drop-over, .kb-blk.drop-over { background: #ececfe; border-color: var(--text-action-high-blue-france, #000091); box-shadow: none; }
  .kb-hidden { display: none !important; }
  .kb-palette { padding: .5rem 1.5rem; background: var(--background-alt-grey, #f6f6f6); border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .kb-pal-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: .375rem .5rem; margin-bottom: .375rem; }
  .kb-pal-row:first-child { align-items: center; }
  .kb-pal-search { flex: 1; min-width: 10rem; max-width: 16rem; margin-left: auto; }
  .kb-pal-fields { display: flex; flex-wrap: wrap; gap: .375rem .5rem; flex: 1; max-height: 5.5rem; overflow-y: auto; align-items: center; }
  .kb-pal-label { font-size: .75rem; font-weight: 700; color: var(--text-mention-grey, #666); margin-right: .125rem; line-height: 1.75rem; }
  .kb-pal-hint { font-size: .75rem; color: var(--text-mention-grey, #666); }
  .kb-chip { border: 1px dashed var(--text-action-high-blue-france, #000091); background: #fff; border-radius: 1rem; padding: .125rem .75rem;
             font: inherit; font-size: .8125rem; cursor: grab; color: var(--text-default-grey, #3a3a3a); }
  .kb-chip:hover { background: #ececfe; }
  .kb-chip-el { font-weight: 700; border-style: solid; }
  .kb-toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: #3a3a3a; color: #fff;
              padding: .5rem 1rem; border-radius: 4px; z-index: 60; display: none; font-size: .875rem; }
  .kb-toast.err { background: #ce0500; }

  /* ---- calendrier / gantt ---- */
  .kb-bar { flex-wrap: wrap; row-gap: .5rem; }
  .cv-tools { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .cv-period { font-size: 1rem; min-width: 8rem; text-align: center; color: var(--text-title-grey, #161616); }
  .cv-ic { min-width: 2rem; justify-content: center; font-size: 1.125rem; line-height: 1; }
  .cv-seg { display: inline-flex; border: 1px solid var(--border-default-grey, #ddd); border-radius: 4px; overflow: hidden; background: #fff; }
  .cv-seg button { border: 0; border-right: 1px solid var(--border-default-grey, #ddd); background: #fff; padding: .25rem .625rem; font: inherit; font-size: .8125rem; cursor: pointer; }
  .cv-seg button:last-child { border-right: 0; }
  .cv-seg button:hover { background: #f6f6f6; }
  .cv-seg button[aria-pressed="true"] { background: var(--background-action-low-blue-france, #e3e3fd); color: var(--text-action-high-blue-france, #000091); font-weight: 700; }
  .cv-undated-wrap { position: relative; }
  .cv-undated { position: absolute; top: calc(100% + 4px); left: 0; width: 280px; max-height: 50vh; overflow-y: auto; z-index: 45; background: #fff;
                border: 1px solid var(--border-default-grey, #ddd); border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.14); padding: 4px; }
  .cv-un-item { display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; padding: 6px 8px; border-radius: 2px; font-size: .8125rem; }
  .cv-un-item:hover { background: #f6f6f6; }
  .kb-board.cv { padding: 0; gap: 0; align-items: stretch; flex-direction: column; overflow: hidden; }

  /* calendrier */
  .cal { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #fff; }
  .cal-head { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .cal-head div { padding: .375rem .5rem; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-mention-grey, #666); }
  .cal-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .cal-week { position: relative; flex: 1 0 auto; min-height: 6.5rem; border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .cal-body.week .cal-week { min-height: 14rem; border-bottom: 0; }
  .cal-days { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-day { border-right: 1px solid #ececec; padding: .25rem .375rem; min-width: 0; }
  .cal-day:last-child { border-right: 0; }
  .cal-day.wkd { background: #fbfbfb; }
  .cal-day.other { background: #f6f6f6; color: #929292; }
  .cal-day.drag-over { background: #ececfe; outline: 2px dashed var(--text-action-high-blue-france, #000091); outline-offset: -2px; }
  .cal-num { display: inline-block; font-size: .8125rem; font-weight: 600; line-height: 1.25rem; }
  .cal-day.today .cal-num { background: var(--text-action-high-blue-france, #000091); color: #fff; border-radius: 1rem; padding: 0 .5rem; }
  .cal-evs { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: min-content; row-gap: 3px; padding: 1.875rem 0 .5rem; pointer-events: none; }
  .ev { pointer-events: auto; margin: 0 3px; min-width: 0; cursor: pointer; border-radius: 4px; border-left: 4px solid var(--ev-bar, #000091);
        box-shadow: 0 0 0 1px rgba(0,0,0,.07); }
  .ev[draggable="true"] { cursor: grab; }
  .ev:hover { box-shadow: 0 0 0 1px var(--text-action-high-blue-france, #000091), 0 2px 6px rgba(0,0,0,.12); }
  .ev.dragging { opacity: .4; }
  .ev.cl, .gt-bar.cl { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .ev.cr, .gt-bar.cr { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .ev.cl { margin-left: 0; } .ev.cr { margin-right: 0; }
  .ev-line { background: var(--ev-bg, #ececfe); color: var(--ev-fg, #161616); padding: 1px 6px; font-size: .8125rem; line-height: 1.375rem; white-space: nowrap; overflow: hidden; }
  .ev-card { background: #fff; padding: .5rem .625rem; }
  .ev-title { overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .ev-card .ev-title { white-space: normal; font-weight: 700; color: var(--text-title-grey, #161616); }
  .ev-card .kb-fields { margin-top: .375rem; gap: .375rem; font-size: .8125rem; }

  /* gantt */
  .gt-scroll { flex: 1; min-height: 0; overflow: auto; position: relative; background: #fff; user-select: none; }
  .gt-inner { position: relative; min-height: 100%; }
  .gt-headrow { display: flex; position: sticky; top: 0; z-index: 6; background: #fff; border-bottom: 1px solid #ccc; }
  .gt-corner { position: sticky; left: 0; z-index: 7; flex: none; width: var(--left); box-sizing: border-box; background: #fff; border-right: 1px solid #ddd;
               display: flex; align-items: flex-end; padding: .5rem .75rem; font-size: .75rem; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: .05em; }

];

            calView: 'month', monthCards: false, ganttView: 'scroll', ganttZoom: 'day' };
let meta = { loaded: false, tableId: '', cols: [], by: {} };
let refs = {};            // colId -> { rows:[{id,label}], map:{id:label} }

const col = (id) => meta.by[id];

const asList = (v) => {
  let a = Array.isArray(v) ? (v[0] === 'L' ? v.slice(1) : v) : (v == null ? [] : [v]);
  return a.filter((x) => x !== '' && x !== 0 && x != null);
};
/* Date / DateTime -> secondes, quelle que soit la forme reçue (nombre, ['d'|'D', ts, tz], Date, moment, texte) */
const toSec = (v) => {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v;
  if (Array.isArray(v)) return typeof v[1] === 'number' ? v[1] : null;
  if (typeof v === 'string') { const t = Date.parse(v); return isNaN(t) ? null : t / 1000; }
  if (v instanceof Date) return v.getTime() / 1000;
  if (typeof v.valueOf === 'function' && typeof v.valueOf() === 'number') return v.valueOf() / 1000;
  return null;
};
/* ------------------------------------------------------------------ *
 * Droits : la configuration et la mise en page sont réservées aux propriétaires du document.
 * Le rôle vient de l'API REST de Grist (GET /docs/{id} → « access »). Tant qu'il est inconnu, ou si la
 * détection échoue, l'utilisateur est considéré comme NON propriétaire (réglages masqués).
 * Ce masquage ne concerne que l'interface : les droits réels restent ceux définis dans Grist.
 * Dépannage : ajouter ?forceOwner=1 à l'URL du widget désactive la détection (réglages toujours visibles).
 * ------------------------------------------------------------------ */
let isOwner = false, accessLevel = null;      // accessLevel : 'owners' | 'editors' | 'viewers' | … | null (inconnu)
const FORCE_OWNER = new URLSearchParams(location.search).get('forceOwner') === '1';
/* Méthodes essayées dans l'ordre (comme dans le widget « Fiche Produit »), la première qui répond l'emporte :
 *  1. grist.getUserSession(), si disponible        2. API REST /api/docs/{docId} (docId lu dans l'adresse de la page Grist)
 *  3. API REST via un jeton d'accès Grist           4. sonde ACL : lecture de la table « OwnerAccess »
 *     (table d'une ligne avec la règle « user.Access != OWNER → refuser la lecture » : lisible par les owners seulement) */
async function accessViaRest() {
  const docId = [document.referrer, location.href].map((s) => {
    const m = s && (s.match(/\/o\/[^/]+\/([a-zA-Z0-9_-]{6,})(?:\/|$)/) || s.match(/\/doc\/([a-zA-Z0-9_-]{6,})/));
    return m ? m[1] : null;
  }).find(Boolean);
  let origin = null; try { origin = new URL(document.referrer).origin; } catch (e) {}
  if (!docId || !origin) return null;
  try {
    const r = await fetch(`${origin}/api/docs/${docId}`, { credentials: 'include' });
    if (r.ok) { const d = await r.json(); return d && typeof d.access === 'string' ? d.access : null; }
  } catch (e) {}
  return null;
}
async function accessViaToken() {
  try {
    const t = await grist.getAccessToken({ readOnly: false });   // un jeton « lecture seule » ramènerait le rôle à « lecteur »
    const q = '?auth=' + encodeURIComponent(t.token);
    const res = await fetch(t.baseUrl + q);
    if (res.ok) { const d = await res.json(); if (d && typeof d.access === 'string') return d.access; }
    const probe = await fetch(t.baseUrl + '/usersForViewAs' + q);   // adresse accessible aux seuls propriétaires
    if (probe.ok) return 'owners';
  } catch (e) {}
  return null;
}
async function accessViaProbe() {
  try { await grist.docApi.fetchTable('OwnerAccess'); return 'owners'; }
  catch (e) {
    if (/not found|no such|unknown table|keyerror|does not exist/i.test(String((e && e.message) || e))) return null;   // la table n'existe pas : on ne peut pas conclure
    return 'non-owner';
  }
}
async function detectOwner() {
  if (FORCE_OWNER || (!IN_GRIST && !DEMO_ROLE)) return 'owners';
  let acc = null;
  try { if (typeof grist.getUserSession === 'function') { const s = await grist.getUserSession(); acc = s && s.access ? s.access : null; } } catch (e) {}
  if (!acc) acc = await accessViaRest();
  if (!acc) acc = await accessViaToken();
  if (!acc) acc = await accessViaProbe();
  console.log('[Kanban] accès au document =', acc);
  return acc;       // inconnu = non propriétaire (interface de configuration masquée)
}
function applyRole() {
  document.querySelectorAll('.kb-owner-only').forEach((n) => n.classList.toggle('kb-hidden', !isOwner));

  clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = 'none'), err ? 5000 : 2200);
}
function hash(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }

/* ------------------------------------------------------------------ *
 * Métadonnées (colonnes, choix, tables référencées)
 * ------------------------------------------------------------------ */
/* Libellés des lignes d'une table, d'après la colonne affichée (rowId de sa définition, 0 = identifiant).
   Si cette colonne est elle-même une référence, on suit la chaîne jusqu'à un texte (profondeur limitée). */
const metaRows = {}, tableCols = {};     // tableCols : colonnes de chaque table (pour choisir le champ affiché d'une référence)
async function labelMap(tableId, visRow, depth) {
  const d = await grist.docApi.fetchTable(tableId), m = visRow ? metaRows[visRow] : null, out = {};
  const vals = m && d[m.colId] ? d[m.colId] : d.id;
  let sub = null;
  if (m && (m.base === 'Ref' || m.base === 'RefList') && m.refTable && depth < 4) { try { sub = await labelMap(m.refTable, m.visRow, depth + 1); } catch (e) {} }
  const f = m && !sub ? makeFmt(m) : null;                       // la référence s'affiche avec le format de sa colonne
  d.id.forEach((id, i) => {
    out[id] = sub ? asList(vals[i]).map((x) => sub[x] ?? String(x)).join(', ') : String(f ? f(vals[i]) : (vals[i] ?? ''));

/* --- lecture ------------------------------------------------------------ */

document.addEventListener('drop', (e) => {
  if (mdrag) {
    e.preventDefault();
    const m = mdrag; mdrag = null; clearRowMarks(); resetGrips();
    if (m.pos !== undefined) applyDrop(m);
    return;
  }
  if (rdrag) {
    e.preventDefault();
    const { list: name, i: from, target } = rdrag;
    rdrag = null; clearRowMarks();
    const list = name === 'modal' ? cfg.modalFields : cfg.cardFields;
    if (!list || !target) return;
    let to = target.i + (target.after ? 1 : 0);
    if (from < to) to--;
    if (to !== from) { const [it] = list.splice(from, 1); list.splice(to, 0, it); persist(); }
    return;
  }
  if (!drag) return;
  const d = dayAtEvent(e); if (d === null) return;
  e.preventDefault();
  const { id, grab } = drag; drag = null;
  document.querySelectorAll('.drag-over').forEach((n) => n.classList.remove('drag-over'));
  moveCardTo(id, grab, d);
});

/* ------------------------------------------------------------------ *
 * Calendrier : jour sous le pointeur ; gantt : déplacer / étirer les barres ; défilement infini ; redimensionnement
 * ------------------------------------------------------------------ */
function dayAtEvent(e) {
  const wk = e.target.closest && e.target.closest('.cal-week'); if (!wk) return null;
  const r = wk.getBoundingClientRect();
  return Number(wk.dataset.w) + Math.max(0, Math.min(6, Math.floor((e.clientX - r.left) / r.width * 7)));
}
let gdrag = null, gJust = false;
document.addEventListener('pointerdown', (e) => {
  const bar = e.target.closest && e.target.closest('.gt-bar[data-drag]');
  if (!bar || e.button !== 0) return;
  const h = e.target.closest('.gt-h'), sc = bar.closest('.gt-scroll');
  gdrag = { id: Number(bar.dataset.id), bar, mode: h ? (h.classList.contains('l') ? 'l' : 'r') : 'move', x0: e.clientX, dw: Number(sc.dataset.dayw),
            s: Number(bar.dataset.s), e: Number(bar.dataset.e), l0: parseFloat(bar.style.left), w0: parseFloat(bar.style.width), delta: 0, moved: false };
});
document.addEventListener('pointermove', (e) => {
  const g = gdrag; if (!g) return;
  const dx = e.clientX - g.x0;
  if (!g.moved && Math.abs(dx) < 4) return;
  g.moved = true;
  let delta = Math.round(dx / g.dw);
  if (g.mode === 'move') g.bar.style.left = (g.l0 + delta * g.dw) + 'px';
  else if (g.mode === 'l') { delta = Math.min(delta, g.e - g.s); g.bar.style.left = (g.l0 + delta * g.dw) + 'px'; g.bar.style.width = (g.w0 - delta * g.dw) + 'px'; }
  else { delta = Math.max(delta, g.s - g.e); g.bar.style.width = (g.w0 + delta * g.dw) + 'px'; }
  g.delta = delta;
});
function endGanttDrag(cancel) {
  const g = gdrag; if (!g) return; gdrag = null;
  if (!g.moved) return;
  gJust = true; setTimeout(() => { gJust = false; }, 60);          // le clic qui suit un glisser n'ouvre pas la fenêtre
  const r = records.find((x) => x.id === g.id);
  const f = !cancel && r && g.delta ? moveFields(r, g.mode, g.delta) : {};
  if (Object.keys(f).length) saveFields(g.id, f); else renderBoard();
}
document.addEventListener('pointerup', () => endGanttDrag(false));
document.addEventListener('pointercancel', () => endGanttDrag(true));
document.addEventListener('click', (e) => { if (gJust) { gJust = false; e.stopPropagation(); e.preventDefault(); } }, true);

/* défilement continu : on agrandit la période affichée quand on approche d'un bord */
$('#kbBoard').addEventListener('scroll', (e) => {
  const sc = e.target;
  if (!sc.classList || !sc.classList.contains('gt-scroll') || cfg.mode !== 'gantt' || ui.ganttView !== 'scroll') return;
  if (performance.now() - lastRender < 150 || gdrag) return;
  const dw = Number(sc.dataset.dayw), vis = sc.clientWidth, ext = Math.max(60, Math.ceil(vis / dw));
  if (sc.scrollLeft < vis * 0.4) { ui.rs -= ext; ui.keepL = sc.scrollLeft + ext * dw; renderBoard(); }
  else if (sc.scrollWidth - sc.scrollLeft - vis < vis * 0.4) { ui.re += ext; ui.keepL = sc.scrollLeft; renderBoard(); }
}, true);
/* recherche : propositions, puis déplacement du calendrier jusqu'à la carte (ou ouverture de la fenêtre si elle n'a pas de date) */
function suggestHtml() {
  const q = norm(search); if (!q) return '';
  const ids = [cfg.titleCol, ...cfg.cardFields.map((f) => f.col)];
  const hits = records.map((r) => ({ r, sp: spanOf(r) })).filter((x) => ids.some((id) => norm(displayText(id, x.r)).includes(q)));
  if (!hits.length) return '<div class="sg-more">Aucune carte trouvée</div>';
  hits.sort((a, b) => (a.sp ? 0 : 1) - (b.sp ? 0 : 1) || (a.sp && b.sp ? a.sp.s - b.sp.s : 0));
  const range = (sp) => sp.s === sp.e ? fmtDay(sp.s, { day: 'numeric', month: 'short', year: 'numeric' })
    : `${fmtDay(sp.s, { day: 'numeric', month: 'short' })} – ${fmtDay(sp.e, { day: 'numeric', month: 'short', year: 'numeric' })}`;
  return hits.slice(0, 8).map(({ r, sp }) => `<button type="button" class="sg-item" data-act="sgGo" data-id="${r.id}"><span class="sg-t">${esc(displayText(cfg.titleCol, r) || 'Sans titre')}</span>`
      + (sp ? `<span class="sg-m">${esc(range(sp))}</span>` : '<span class="sg-m nodate">Sans date · ouvrir la fiche</span>') + '</button>').join('')
    + (hits.length > 8 ? `<div class="sg-more">${hits.length - 8} autre${hits.length - 8 > 1 ? 's' : ''} résultat${hits.length - 8 > 1 ? 's' : ''} : précisez la recherche</div>` : '');
}
function showSuggest() { const el = $('#kbSuggest'), h = meta.loaded ? suggestHtml() : ''; el.innerHTML = h; el.hidden = !h; }
function hideSuggest() { $('#kbSuggest').hidden = true; }
function goToRecord(id) {
  const r = records.find((x) => x.id === id); if (!r) return;
  hideSuggest();
  const sp = spanOf(r);
  if (!sp) { openModal(id); return; }
  let need;
  if (cfg.mode === 'gantt' && ui.ganttView === 'scroll') {
    const sc = document.querySelector('.gt-scroll');
    if (sc && Number(sc.dataset.dayw)) {
      const dw = Number(sc.dataset.dayw), v0 = ui.rs + sc.scrollLeft / dw, v1 = v0 + (sc.clientWidth - Number(sc.dataset.left)) / dw;
      need = sp.e < v0 || sp.s > v1;
    } else need = true;
  } else {
    let vs, ve;
    if (ui.calView === 'week') { vs = weekStart(ui.anchor); ve = vs + 6; }
    else { const p = ymd(ui.anchor); vs = dayFrom(p.y, p.m, 1); ve = dayFrom(p.y, p.m + 1, 0); }
    need = sp.e < vs || sp.s > ve;
  }
  if (need) { ui.anchor = sp.s; ui.gInit = false; }
  ui.collapsed.clear(); ui.flash = id; renderBoard();
}
/* bulle d'informations au survol d'une barre compacte du calendrier (vue mois) */
let popId = null;
function hidePop() { popId = null; const p = $('#cvPop'); if (p) p.hidden = true; }
function showPop(el) {
  const id = Number(el.dataset.id), r = records.find((x) => x.id === id), p = $('#cvPop'); if (!r) return hidePop();
  const sp = spanOf(r), k = evColor(r);
  const when = !sp ? '' : sp.s === sp.e ? fmtDay(sp.s, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
    : `${fmtDay(sp.s, { day: 'numeric', month: 'short' })} – ${fmtDay(sp.e, { day: 'numeric', month: 'short', year: 'numeric' })}`;
  const fields = cfg.cardFields.map((f) => fieldHtml(f, r)).filter(Boolean).join('');
  p.style.setProperty('--ev-bar', k.bar);
  p.innerHTML = `<div class="ev-title">${esc(displayText(cfg.titleCol, r) || 'Sans titre')}</div>${when ? `<div class="cv-pop-d">${esc(when)}</div>` : ''}${fields ? `<div class="kb-fields">${fields}</div>` : ''}`;
  p.hidden = false; popId = id;
  const b = el.getBoundingClientRect(), w = p.offsetWidth, h = p.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
  let top = b.bottom + 6; if (top + h > vh - 8) top = Math.max(8, b.top - h - 6);
  p.style.left = Math.max(8, Math.min(b.left, vw - w - 8)) + 'px'; p.style.top = top + 'px';
}
document.addEventListener('mouseover', (e) => {
  const el = e.target.closest && e.target.closest('.ev-line');
  if (!el || drag || $('#kbOverlay').classList.contains('open')) return;
  if (popId === Number(el.dataset.id) && !$('#cvPop').hidden) return;
  showPop(el);
});
document.addEventListener('mouseout', (e) => {
  const el = e.target.closest && e.target.closest('.ev-line');
  if (el && !(e.relatedTarget && el.contains(e.relatedTarget))) hidePop();
});
document.addEventListener('dragstart', hidePop, true);
document.addEventListener('click', hidePop, true);
document.addEventListener('scroll', hidePop, true);
let resizeT;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { if (meta.loaded && cfg.mode === 'gantt' && ui.ganttView === 'calendar') renderBoard(); }, 150);
});

/* ------------------------------------------------------------------ *
 * Démarrage
 * ------------------------------------------------------------------ */
/* Par défaut Grist renvoie le libellé des références, pas leur identifiant : on demande les identifiants
   (expandRefs: false) et, par sécurité, on retraduit un éventuel libellé en identifiant. */
function refIdOf(c, v) {
  if (Array.isArray(v) && v[0] === 'R') v = v[2];        // forme codée ['R', table, identifiant ou libellé]
  if (typeof v === 'number' || v == null || v === '') return v;
  const hit = (refs[c.colId]?.rows || []).find((x) => x.label === v);
  return hit ? hit.id : v;
}
function normRecords() {
  const rc = meta.cols.filter((c) => c.base === 'Ref' || c.base === 'RefList');
  if (!rc.length) return;
  records.forEach((r) => rc.forEach((c) => {
    const v = r[c.colId];
    if (c.base === 'Ref') r[c.colId] = refIdOf(c, v);
    else if (Array.isArray(v)) r[c.colId] = ['L', ...asList(v).map((x) => refIdOf(c, x))];
  }));
}

grist.ready({ requiredAccess: 'full', onEditOptions: openSettings });
detectOwner().then((acc) => { accessLevel = acc; isOwner = acc === 'owners'; applyRole(); });
grist.onOptions((o) => {
  const c = (o && o.cfg) || {};
  if (sentCfg.includes(JSON.stringify(c))) return;       // écho de notre propre enregistrement
  cfg = Object.assign({}, cfg, c);
  syncUi();
  renderBoard();
});
/* onRecords sert à savoir QUELLES lignes afficher (filtres, liens entre widgets) et à être prévenu des changements.
   Les valeurs, elles, sont relues en brut (identifiants, dates en nombre, listes ['L', …]) : c'est le seul format
   fiable, quelle que soit la version de Grist. */
let loadSeq = 0;
async function loadRecords(rows) {
  const seq = ++loadSeq;
  let raw = null;
  try { raw = await grist.docApi.fetchTable(meta.tableId || await grist.getTable().getTableId()); } catch (e) {}
  if (seq !== loadSeq) return;                           // une mise à jour plus récente est arrivée entre-temps
  if (raw && Array.isArray(raw.id)) {
    const idx = new Map(raw.id.map((id, i) => [id, i]));
    const keys = Object.keys(raw).filter((k) => k !== 'id');
    records = rows.map((row) => {
      const i = idx.get(row.id);
      if (i === undefined) return row;
      const rec = { id: row.id };
      keys.forEach((k) => { rec[k] = raw[k][i]; });
      return rec;
    });
  } else records = rows;
  normRecords();
  renderBoard();
  if (modalId !== null && !records.some((r) => r.id === modalId)) closeModal();
}
grist.onRecords((rows) => { loadRecords(rows); }, { includeColumns: 'shown', keepEncoded: true, expandRefs: false, format: 'rows' });
renderBoard();
loadMeta().then(() => {
  if (!cfg.cardFields.length) {
    cfg.cardFields = meta.cols.filter((c) => c.colId !== cfg.titleCol && c.colId !== cfg.startCol && c.colId !== cfg.endCol && c.colId !== cfg.colorCol && ['Choice', 'Ref'].includes(c.base)).slice(0, 3)
      .map((c) => ({ col: c.colId }));
  }
  if (!cfg.modalFields) cfg.modalFields = [cfg.startCol, cfg.endCol, ...cfg.cardFields.map((f) => f.col)]
    .filter((c, i, a) => c && col(c) && c !== cfg.titleCol && a.indexOf(c) === i).map((c) => ({ col: c, w: defaultWidth(col(c)) }));
  normRecords();
  renderBoard(); renderDrawer();
}).catch((e) => { $('#kbBoard').innerHTML = `<div class="kb-empty"><p>Impossible de lire la structure de la table.</p><p class="fr-hint-text">${esc(e.message || e)}<br>Vérifiez que le widget a l’accès « Accès complet au document ».</p></div>`; });
</script>
<div class="cv-pop" id="cvPop" hidden></div>
